name: CI

# No branch filters, deliberately. This repository's default branch is not
# `main`, and a hardcoded branch list has already silently disabled CI once:
# the filters named a branch that was later deleted, so neither pushes nor
# pull requests ran any checks. Running everywhere costs a little CI time and
# cannot fail closed.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # `postinstall` runs `prisma generate`, which needs no database.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
